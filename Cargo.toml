[workspace]
resolver = "3"
members = [
    "crates/butter",
    "crates/butter-core",
    "crates/butter-actuator",
    "crates/butter-boot",
    "crates/butter-web",
    "crates/butter-data",
    "crates/butter-workflow",
]
default-members = ["crates/butter"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/samjingwen/butter"
publish = false

[workspace.dependencies]
butter-core = { path = "crates/butter-core" }
butter-actuator = { path = "crates/butter-actuator" }
butter-web = { path = "crates/butter-web" }
butter-boot = { path = "crates/butter-boot" }
butter-data = { path = "crates/butter-data" }
butter-workflow = { path = "crates/butter-workflow" }
axum = "=0.8.9"
tokio = "=1.54.1"
tracing = "=0.1.44"
sqlx = { version = "=0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate"] }
# One immutable upstream graph. Only the persistence implementation needing
# atomic-completion changes is maintained as local source.
batter-core = { git = "https://github.com/bpcakes/batter", rev = "45b451b3b9b628be1010095c92859b7d42b9e157" }
batter-axum = { git = "https://github.com/bpcakes/batter", rev = "45b451b3b9b628be1010095c92859b7d42b9e157" }
batter-sqlx = { git = "https://github.com/bpcakes/batter", rev = "45b451b3b9b628be1010095c92859b7d42b9e157" }
runledger-core = { git = "https://github.com/bpcakes/batter", rev = "45b451b3b9b628be1010095c92859b7d42b9e157" }
runledger-test-support = { git = "https://github.com/bpcakes/batter", rev = "45b451b3b9b628be1010095c92859b7d42b9e157" }
cron = "=0.17.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
