[package]
name = "butter-workflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Durable tasks and workflows for Rust"

[dependencies]
batter-sqlx.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cron.workspace = true
runledger-core = { workspace = true, features = ["sqlx-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sqlx.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
tempfile = "3"
static_assertions = "1.1.0"
runledger-test-support.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time", "io-util", "net", "test-util"] }

[features]
test-support = []

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
cognitive_complexity = "warn"
too_many_lines = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
future_not_send = "deny"
large_futures = "deny"
large_stack_frames = "deny"
